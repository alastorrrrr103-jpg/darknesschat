<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarknessChat | Sign Up</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0f0f0f;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
}

.container{
width:95%;
max-width:430px;
background:#1b1b1b;
padding:35px;
border-radius:18px;
box-shadow:0 0 25px rgba(0,0,0,.5);
}

.logo{
font-size:40px;
text-align:center;
}

.title{
font-size:30px;
text-align:center;
margin-top:10px;
}

.subtitle{
text-align:center;
color:#999;
margin:10px 0 25px;
}

input,
select{
width:100%;
padding:14px;
margin-bottom:14px;
border:none;
border-radius:10px;
background:#2b2b2b;
color:white;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#7c3aed;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#6d28d9;
}

.bottom{
margin-top:20px;
text-align:center;
color:#aaa;
}

.bottom a{
color:#8b5cf6;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">🌑</div>

<div class="title">Create Account</div>

<div class="subtitle">
Join DarknessChat
</div>

<input type="text" id="username" placeholder="Username">

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<input type="password" id="confirmPassword" placeholder="Confirm Password">

<select id="age">
<option value="">Select your age</option>
<option>13</option>
<option>14</option>
<option>15</option>
<option>16</option>
<option>17</option>
<option>18</option>
<option>19</option>
<option>20</option>
<option>21+</option>
</select>

<button id="signupBtn">
Create Account
</button>

<div class="bottom">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<script type="module" src="signup.js"></script>

</body>
</html>
