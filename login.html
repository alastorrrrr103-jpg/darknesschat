<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DarknessChat | Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f0f0f;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

.container{
    width:95%;
    max-width:420px;
    background:#1b1b1b;
    border-radius:18px;
    padding:35px;
    box-shadow:0 0 25px rgba(0,0,0,.5);
}

.logo{
    font-size:40px;
    text-align:center;
}

.title{
    text-align:center;
    font-size:30px;
    margin-top:10px;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-top:10px;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#2b2b2b;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#7c3aed;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#6d28d9;
}

.bottom{
    margin-top:20px;
    text-align:center;
    color:#aaa;
}

.bottom a{
    color:#8b5cf6;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">🌑</div>

<div class="title">
DarknessChat
</div>

<div class="subtitle">
Welcome back!
</div>

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">
Login
</button>

<div class="bottom">
Don't have an account?
<a href="signup.html">Sign Up</a>
</div>

</div>

</body>
</html>
